name: Build Mod

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install tools
      run: |
        mkdir -p tools && cd tools
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
        pip install cloudscraper --quiet

    - name: Download APK
      run: |
        mkdir -p work
        cd work
        python3 ../download_apk.py
        ls -la original.apk

    - name: Decompile APK
      run: |
        cd work
        java -jar ../tools/apktool.jar d original.apk -o decoded --force

    - name: Extract native libraries
      run: |
        cd work/decoded
        mkdir -p ../libs
        if [ -d "lib/arm64-v8a" ]; then
          cp lib/arm64-v8a/*.so ../libs/
        elif [ -d "lib/armeabi-v7a" ]; then
          cp lib/armeabi-v7a/*.so ../libs/
        fi

    - name: Full analysis report
      run: |
        cd work/libs
        
        REPORT=../report.txt
        echo "=== LIBRARY COUNT: $(ls *.so | wc -l) ===" > $REPORT
        echo "" >> $REPORT
        
        echo "=== ALL LIBRARIES WITH SIZES ===" >> $REPORT
        for f in $(ls -S *.so); do
          SIZE=$(stat -c%s "$f")
          SIZE_MB=$((SIZE / 1048576))
          echo "${SIZE_MB}MB  $f" >> $REPORT
        done
        echo "" >> $REPORT
        
        echo "=== CRITICAL TARGETS FOUND ===" >> $REPORT
        for f in *.so; do
          if [ $(stat -c%s "$f") -gt 50000000 ]; then
            echo "ENGINE CANDIDATE: $f ($(stat -c%s "$f") bytes)" >> $REPORT
          fi
        done
        echo "" >> $REPORT
        
        echo "=== LARGEST 5 LIBRARIES — KEY STRINGS ===" >> $REPORT
        for f in $(ls -S *.so | head -5); do
          echo "" >> $REPORT
          echo "--- $f ($(stat -c%s "$f") bytes) ---" >> $REPORT
          echo "UE4/Engine:" >> $REPORT
          strings "$f" | grep -iE "GObjects|GNames|GEngine|GWorld|ProcessEvent|UWorld|AActor|APawn|FVector|FRotator|ULocalPlayer" | sort -u | head -20 >> $REPORT 2>/dev/null || true
          echo "AntiCheat:" >> $REPORT
          strings "$f" | grep -iE "anticheat|anti_cheat|detect_root|detect_hook|detect_frida|integrity_check|signature_check|memory_scan|ptrace_check" | sort -u | head -20 >> $REPORT 2>/dev/null || true
          echo "Security:" >> $REPORT
          strings "$f" | grep -iE "tersafe|sgmain|SecShell|DexHelper|NSaferOnly|boom|tp2|SecurityCheck" | sort -u | head -15 >> $REPORT 2>/dev/null || true
        done
        echo "" >> $REPORT
        
        echo "=== ALL .SO FILE NAMES ===" >> $REPORT
        ls *.so >> $REPORT
        echo "" >> $REPORT
        
        echo "=== REPORT COMPLETE ===" >> $REPORT

    - name: Rebuild APK
      run: |
        cd work
        java -jar ../tools/apktool.jar b decoded -o repacked.apk --force

    - name: Sign APK
      run: |
        cd work
        java -jar ../tools/signer.jar -a repacked.apk --allowResign

    - name: Prepare output
      run: |
        mkdir -p output
        cp work/repacked-aligned-debugSigned.apk output/pm-mod-test.apk 2>/dev/null || true
        cp work/original.apk output/original.apk 2>/dev/null || true
        cp work/report.txt output/report.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pm-build
        path: output/

    - name: PRINT SUMMARY AT END
      run: |
        echo ""
        echo "=========================================="
        echo "     CRITICAL INFO — READ BELOW"
        echo "=========================================="
        cat work/report.txt
        echo "=========================================="
        echo "     END OF REPORT"
        echo "=========================================="
