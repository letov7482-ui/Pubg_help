name: Build PUBG Mod

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install tools
      run: |
        mkdir -p tools && cd tools
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
        pip install cloudscraper capstone pyelftools --quiet
        ls -la

    - name: Download APK
      run: |
        mkdir -p work
        cd work
        python3 ../download_apk.py
        ls -la original.apk

    - name: Decompile APK
      run: |
        cd work
        java -jar ../tools/apktool.jar d original.apk -o decoded --force

    - name: Extract native libraries
      run: |
        cd work/decoded
        mkdir -p ../libs
        if [ -d "lib/arm64-v8a" ]; then
          cp lib/arm64-v8a/*.so ../libs/
        fi
        ls -la ../libs/ | head -20

    - name: Run antiban patches
      run: |
        cd work
        python3 ../antiban.py libs/

    - name: Copy patched libs back
      run: |
        cp work/libs/*.so work/decoded/lib/arm64-v8a/

    - name: Remove anticheat libraries
      run: |
        rm -f work/decoded/lib/arm64-v8a/libanogs.so
        rm -f work/decoded/lib/arm64-v8a/libanort.so
        rm -f work/decoded/lib/arm64-v8a/libTDataMaster.so
        rm -f work/decoded/lib/arm64-v8a/libCrashSight.so
        echo "Anticheat libs removed"

    - name: Smali loadLibrary stub
      run: |
        find work/decoded -name "*.smali" -exec sed -i 's/"anogs"/"crosCurl"/g' {} \;
        find work/decoded -name "*.smali" -exec sed -i 's/"TDataMaster"/"crosCurl"/g' {} \;
        echo "Smali patched"

    - name: Rebuild APK
      run: |
        cd work
        java -jar ../tools/apktool.jar b decoded -o repacked.apk --force

    - name: Sign APK
      run: |
        cd work
        java -jar ../tools/signer.jar -a repacked.apk --allowResign

    - name: Prepare output
      run: |
        mkdir -p output
        cp work/repacked-aligned-debugSigned.apk output/pm-mod-test.apk 2>/dev/null || true
        cp work/original.apk output/original.apk 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pm-build
        path: output/
