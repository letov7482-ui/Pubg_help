name: Build Mod

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download tools
      run: |
        mkdir -p tools && cd tools
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
        ls -la

    - name: Download APK
      run: |
        mkdir -p work
        cd work
        # Пробуем несколько источников
        # Источник 1: APKCombo
        wget -L -q "https://download.apkcombo.com/down.php?package=com.tencent.ig&versionCode=4600" -O original.apk 2>/dev/null || true
        # Проверяем что скачалось
        if [ ! -s original.apk ] || ! file original.apk | grep -q "Zip\|Android"; then
          echo "Source 1 failed, trying source 2..."
          # Источник 2: GitHub mirror PUBG APK
          wget -L -q "https://github.com/nicehash2000/PUBG-Mobile-APK/raw/main/PUBG-Mobile-4.6.0.apk" -O original.apk 2>/dev/null || true
        fi
        if [ ! -s original.apk ] || ! file original.apk | grep -q "Zip\|Android"; then
          echo "Source 2 failed, trying source 3..."
          # Источник 3: прямая ссылка через curl с юзер-агентом
          curl -L -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36" -o original.apk "https://d.apkpure.com/b/XAPK/com.tencent.ig?version=latest" 2>/dev/null || true
        fi
        # Проверка
        ls -la original.apk
        file original.apk
        # Если файл меньше 10MB — что-то не так
        SIZE=$(stat -c%s original.apk)
        echo "File size: $SIZE bytes"
        if [ "$SIZE" -lt 10000000 ]; then
          echo "ERROR: APK too small, download failed"
          exit 1
        fi

    - name: Decompile APK
      run: |
        cd work
        java -jar ../tools/apktool.jar d original.apk -o decoded --force

    - name: Extract native libraries
      run: |
        cd work/decoded
        mkdir -p ../libs
        if [ -d "lib/arm64-v8a" ]; then
          cp lib/arm64-v8a/*.so ../libs/
        elif [ -d "lib/armeabi-v7a" ]; then
          cp lib/armeabi-v7a/*.so ../libs/
        fi
        ls -la ../libs/

    - name: Analyze native libs
      run: |
        cd work/libs
        for f in *.so; do
          echo "=== $f ==="
          file "$f"
          echo "Size: $(stat -c%s "$f") bytes"
          strings "$f" | grep -iE "aim|esp|wall|speed|recoil|anti|detect|hook" | head -30 || true
        done

    - name: Rebuild APK
      run: |
        cd work
        java -jar ../tools/apktool.jar b decoded -o repacked.apk --force

    - name: Sign APK
      run: |
        cd work
        java -jar ../tools/signer.jar -a repacked.apk --allowResign

    - name: Prepare output
      run: |
        mkdir -p output
        cp work/repacked-aligned-debugSigned.apk output/pm-mod-test.apk
        cp work/original.apk output/original.apk

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pm-build
        path: output/
