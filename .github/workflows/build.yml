name: Build Mod

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download tools
      run: |
        mkdir -p tools && cd tools
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
        ls -la

    - name: Download APK via proxy
      run: |
        mkdir -p work
        cd work
        
        # Целевая ссылка
        TARGET="https://d.apkpure.com/b/APK/com.tencent.ig?version=latest"
        
        # Прокси 1: allorigins
        echo "Trying proxy 1 (allorigins)..."
        wget -q "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TARGET', safe=''))")" -O original.apk 2>/dev/null || true
        SIZE=$(stat -c%s original.apk 2>/dev/null || echo 0)
        if [ "$SIZE" -gt 10000000 ] && file original.apk | grep -q "Zip\|Android"; then
          echo "SUCCESS via allorigins: $SIZE bytes"
        else
          echo "Proxy 1 failed (size: $SIZE)"
          
          # Прокси 2: codetabs
          echo "Trying proxy 2 (codetabs)..."
          wget -q "https://api.codetabs.com/v1/proxy?quest=$TARGET" -O original.apk 2>/dev/null || true
          SIZE=$(stat -c%s original.apk 2>/dev/null || echo 0)
          if [ "$SIZE" -gt 10000000 ] && file original.apk | grep -q "Zip\|Android"; then
            echo "SUCCESS via codetabs: $SIZE bytes"
          else
            echo "Proxy 2 failed (size: $SIZE)"
            
            # Прокси 3: corsproxy
            echo "Trying proxy 3 (corsproxy)..."
            wget -q "https://corsproxy.io/?$TARGET" -O original.apk 2>/dev/null || true
            SIZE=$(stat -c%s original.apk 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 10000000 ] && file original.apk | grep -q "Zip\|Android"; then
              echo "SUCCESS via corsproxy: $SIZE bytes"
            else
              echo "Proxy 3 failed (size: $SIZE)"
              
              # Прокси 4: Google Translate proxy (обход Cloudflare)
              echo "Trying proxy 4 (translate proxy)..."
              wget -q "https://d-apkpure-com.translate.goog/b/APK/com.tencent.ig?version=latest&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en" -O original.apk 2>/dev/null || true
              SIZE=$(stat -c%s original.apk 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 10000000 ] && file original.apk | grep -q "Zip\|Android"; then
                echo "SUCCESS via translate: $SIZE bytes"
              else
                echo "ALL PROXIES FAILED"
                exit 1
              fi
            fi
          fi
        fi
        
        ls -la original.apk
        file original.apk

    - name: Decompile APK
      run: |
        cd work
        java -jar ../tools/apktool.jar d original.apk -o decoded --force

    - name: Extract native libraries
      run: |
        cd work/decoded
        mkdir -p ../libs
        if [ -d "lib/arm64-v8a" ]; then
          cp lib/arm64-v8a/*.so ../libs/
        elif [ -d "lib/armeabi-v7a" ]; then
          cp lib/armeabi-v7a/*.so ../libs/
        fi
        ls -la ../libs/

    - name: Analyze native libs
      run: |
        cd work/libs
        for f in *.so; do
          echo "=== $f ==="
          file "$f"
          echo "Size: $(stat -c%s "$f") bytes"
          strings "$f" | grep -iE "aim|esp|wall|speed|recoil|anti|detect|hook" | head -30 || true
        done

    - name: Rebuild APK
      run: |
        cd work
        java -jar ../tools/apktool.jar b decoded -o repacked.apk --force

    - name: Sign APK
      run: |
        cd work
        java -jar ../tools/signer.jar -a repacked.apk --allowResign

    - name: Prepare output
      run: |
        mkdir -p output
        cp work/repacked-aligned-debugSigned.apk output/pm-mod-test.apk
        cp work/original.apk output/original.apk

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pm-build
        path: output/
